<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><defs><marker id="a37474f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="s37474f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#37474f"/></marker><marker id="aef6c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><marker id="sef6c00" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ef6c00"/></marker><marker id="a1565c0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="s1565c0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#1565c0"/></marker><marker id="a2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="s2e7d32" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#2e7d32"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="550" y="26" text-anchor="middle" font-size="17" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">End-to-end sequence: from detection to a finished rescue</text><rect x="38" y="62" width="124" height="30" rx="6" fill="#eceff1" stroke="#37474f" stroke-width="1.6"/><text x="100.0" y="82" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Writer</text><line x1="100" y1="96" x2="100" y2="556" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="258" y="62" width="124" height="30" rx="6" fill="#eceff1" stroke="#37474f" stroke-width="1.6"/><text x="320.0" y="82" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Beacon mesh</text><line x1="320" y1="96" x2="320" y2="556" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="478" y="62" width="124" height="30" rx="6" fill="#eceff1" stroke="#37474f" stroke-width="1.6"/><text x="540.0" y="82" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Van (ONA)</text><line x1="540" y1="96" x2="540" y2="556" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="718" y="62" width="124" height="30" rx="6" fill="#eceff1" stroke="#37474f" stroke-width="1.6"/><text x="780.0" y="82" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Command Post</text><line x1="780" y1="96" x2="780" y2="556" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="928" y="62" width="124" height="30" rx="6" fill="#eceff1" stroke="#37474f" stroke-width="1.6"/><text x="990.0" y="82" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Executor</text><line x1="990" y1="96" x2="990" y2="556" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="532" y="96" width="16" height="460" fill="#bbdefb" opacity="0.5"/><rect x="8" y="112" width="446.0" height="22" rx="5" fill="#fffde7" stroke="#bdbdbd"/><text x="18" y="127" font-size="10.5" font-family="DejaVu Sans, Arial, sans-serif">1 GPS to the door; inside no GPS: explore, sense (2-of-3 + persistence)</text><line x1="100" y1="148" x2="320" y2="148" stroke="#ef6c00" stroke-width="2" marker-end="url(#aef6c00)"/><text x="210.0" y="143" text-anchor="middle" font-size="10.5" fill="#ef6c00" font-family="DejaVu Sans, Arial, sans-serif">2 drop beacon: 32 B, egocentric hop + target, class P0..P3</text><line x1="320" y1="172" x2="540" y2="172" stroke="#ef6c00" stroke-width="2" marker-end="url(#aef6c00)"/><text x="430.0" y="167" text-anchor="middle" font-size="10.5" fill="#ef6c00" font-family="DejaVu Sans, Arial, sans-serif">3 RF multi-hop, store-and-forward, ARQ x3 (repeater if link weak)</text><rect x="395.0" y="184" width="290.0" height="22" rx="5" fill="#fffde7" stroke="#bdbdbd"/><text x="405.0" y="199" font-size="10.5" font-family="DejaVu Sans, Arial, sans-serif">4 CRC16 + MAC check, chain hops, ENU -&gt; WGS84</text><line x1="540" y1="220" x2="780" y2="220" stroke="#1565c0" stroke-width="2" marker-end="url(#a1565c0)"/><text x="660.0" y="215" text-anchor="middle" font-size="10.5" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">5 uplink :9101  (P0 at once; others 120 s / size / score)</text><rect x="554.0" y="232" width="452.0" height="22" rx="5" fill="#fffde7" stroke="#bdbdbd"/><text x="564.0" y="247" font-size="10.5" font-family="DejaVu Sans, Arial, sans-serif">6 every 1 s: update pi, correlate; low-urgency jobs wait while exploring</text><line x1="780" y1="268" x2="540" y2="268" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2e7d32)"/><text x="660.0" y="263" text-anchor="middle" font-size="10.5" fill="#2e7d32" font-family="DejaVu Sans, Arial, sans-serif">7 briefing + first order (critical pi &lt; crit skips the wait)</text><line x1="540" y1="292" x2="990" y2="292" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2e7d32)"/><text x="765.0" y="287" text-anchor="middle" font-size="10.5" fill="#2e7d32" font-family="DejaVu Sans, Arial, sans-serif">8 briefing handed over at the van, robot enters</text><rect x="772.0" y="304" width="320.0" height="22" rx="5" fill="#fffde7" stroke="#bdbdbd"/><text x="782.0" y="319" font-size="10.5" font-family="DejaVu Sans, Arial, sans-serif">9 A* to the target, LiDAR replanning, hazard check</text><line x1="990" y1="340" x2="540" y2="340" stroke="#1565c0" stroke-width="2" marker-end="url(#a1565c0)"/><text x="765.0" y="335" text-anchor="middle" font-size="10.5" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">10 status: ARRIVED / FIRE_OUT / RESCUED / heartbeat</text><line x1="540" y1="364" x2="780" y2="364" stroke="#1565c0" stroke-width="2" marker-end="url(#a1565c0)"/><text x="660.0" y="359" text-anchor="middle" font-size="10.5" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">11 forward status (the van is the only relay)</text><line x1="780" y1="388" x2="540" y2="388" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2e7d32)"/><text x="660.0" y="383" text-anchor="middle" font-size="10.5" fill="#2e7d32" font-family="DejaVu Sans, Arial, sans-serif">12 ORDER_UPDATE: hazard cleared / new job</text><line x1="540" y1="412" x2="990" y2="412" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2e7d32)"/><text x="765.0" y="407" text-anchor="middle" font-size="10.5" fill="#2e7d32" font-family="DejaVu Sans, Arial, sans-serif">13 relayed to the robot's own topic /station/to/&lt;role&gt;</text><line x1="100" y1="436" x2="540" y2="436" stroke="#1565c0" stroke-width="2" marker-end="url(#a1565c0)"/><text x="320.0" y="431" text-anchor="middle" font-size="10.5" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">14 Writer: exploration complete (to the van only)</text><line x1="540" y1="460" x2="780" y2="460" stroke="#1565c0" stroke-width="2" marker-end="url(#a1565c0)"/><text x="660.0" y="455" text-anchor="middle" font-size="10.5" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">15 forwarded: held low-urgency jobs are released</text><rect x="862.0" y="472" width="230.0" height="22" rx="5" fill="#fffde7" stroke="#bdbdbd"/><text x="872.0" y="487" font-size="10.5" font-family="DejaVu Sans, Arial, sans-serif">16 enter, rescue, return to the van</text><line x1="990" y1="508" x2="540" y2="508" stroke="#1565c0" stroke-width="2" marker-end="url(#a1565c0)"/><text x="765.0" y="503" text-anchor="middle" font-size="10.5" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">17 RETURNED -&gt; role free for the next order</text><line x1="540" y1="532" x2="780" y2="532" stroke="#1565c0" stroke-width="2" marker-end="url(#a1565c0)"/><text x="660.0" y="527" text-anchor="middle" font-size="10.5" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">18 live map: RESOLVED</text><text x="554" y="574" font-size="10.5" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">the van is the only point where inside and outside meet</text></svg>