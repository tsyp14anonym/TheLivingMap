<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><defs><marker id="a37474f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="s37474f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#37474f"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="500" y="26" text-anchor="middle" font-size="17" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Beacon v2: 32 bytes, egocentric (no absolute coordinates inside the building)</text><rect x="20.0" y="60.0" width="57.0" height="56" fill="#e3f2fd" stroke="#455a64"/><text x="48.5" y="84.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">magic</text><text x="48.5" y="100.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">1 B</text><rect x="77.0" y="60.0" width="114.0" height="56" fill="#e3f2fd" stroke="#455a64"/><text x="134.0" y="84.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">id</text><text x="134.0" y="100.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">2 B beacon</text><rect x="191.0" y="60.0" width="57.0" height="56" fill="#e3f2fd" stroke="#455a64"/><text x="219.5" y="84.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">org</text><text x="219.5" y="100.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">1 B</text><rect x="248.0" y="60.0" width="114.0" height="56" fill="#e3f2fd" stroke="#455a64"/><text x="305.0" y="84.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">seq</text><text x="305.0" y="100.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">2 B version</text><rect x="362.0" y="60.0" width="228.0" height="56" fill="#fff3e0" stroke="#455a64"/><text x="476.0" y="84.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">t0</text><text x="476.0" y="100.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">4 B written at (s)</text><rect x="590.0" y="60.0" width="57.0" height="56" fill="#fff3e0" stroke="#455a64"/><text x="618.5" y="84.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">T|P|F</text><text x="618.5" y="100.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">1 B</text><rect x="647.0" y="60.0" width="57.0" height="56" fill="#fff3e0" stroke="#455a64"/><text x="675.5" y="84.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">floor</text><text x="675.5" y="100.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">1 B</text><rect x="704.0" y="60.0" width="57.0" height="56" fill="#fff3e0" stroke="#455a64"/><text x="732.5" y="84.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">n</text><text x="732.5" y="100.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">1 B</text><rect x="761.0" y="60.0" width="57.0" height="56" fill="#e8f5e9" stroke="#455a64"/><text x="789.5" y="84.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">hdg</text><text x="789.5" y="100.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">1 B</text><rect x="818.0" y="60.0" width="57.0" height="56" fill="#e8f5e9" stroke="#455a64"/><text x="846.5" y="84.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">hopF</text><text x="846.5" y="100.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">1 B</text><rect x="875.0" y="60.0" width="57.0" height="56" fill="#e8f5e9" stroke="#455a64"/><text x="903.5" y="84.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">hopR</text><text x="903.5" y="100.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">1 B</text><rect x="20.0" y="140.0" width="57.0" height="56" fill="#e8f5e9" stroke="#455a64"/><text x="48.5" y="164.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">tgtF</text><text x="48.5" y="180.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">1 B</text><rect x="77.0" y="140.0" width="57.0" height="56" fill="#e8f5e9" stroke="#455a64"/><text x="105.5" y="164.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">tgtR</text><text x="105.5" y="180.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">1 B</text><rect x="134.0" y="140.0" width="114.0" height="56" fill="#f3e5f5" stroke="#455a64"/><text x="191.0" y="164.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">parent</text><text x="191.0" y="180.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">2 B chain</text><rect x="248.0" y="140.0" width="114.0" height="56" fill="#fce4ec" stroke="#455a64"/><text x="305.0" y="164.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">temp</text><text x="305.0" y="180.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">2 B 0.1 C</text><rect x="362.0" y="140.0" width="114.0" height="56" fill="#fce4ec" stroke="#455a64"/><text x="419.0" y="164.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">gas</text><text x="419.0" y="180.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">2 B ppm</text><rect x="476.0" y="140.0" width="114.0" height="56" fill="#f3e5f5" stroke="#455a64"/><text x="533.0" y="164.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">mirror id</text><text x="533.0" y="180.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">2 B neighbour</text><rect x="590.0" y="140.0" width="57.0" height="56" fill="#f3e5f5" stroke="#455a64"/><text x="618.5" y="164.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">m.seq</text><text x="618.5" y="180.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">1 B</text><rect x="647.0" y="140.0" width="114.0" height="56" fill="#eeeeee" stroke="#455a64"/><text x="704.0" y="164.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">CRC16</text><text x="704.0" y="180.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">2 B integrity</text><rect x="761.0" y="140.0" width="171.0" height="56" fill="#eeeeee" stroke="#455a64"/><text x="846.5" y="164.0" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">MAC</text><text x="846.5" y="180.0" text-anchor="middle" font-size="9.5" fill="#455a64" font-family="DejaVu Sans, Arial, sans-serif">3 B HMAC-SHA256/24</text><text x="20.0" y="54.0" font-size="10" fill="#607d8b" font-family="DejaVu Sans, Arial, sans-serif">bytes 0-15</text><text x="20.0" y="134.0" font-size="10" fill="#607d8b" font-family="DejaVu Sans, Arial, sans-serif">bytes 16-31</text><text x="20" y="250" font-size="11.5" font-family="DejaVu Sans, Arial, sans-serif">T|P|F = packet type (4 bits: REPEATER, FIRE, GAS, HUMAN, ANIMAL, DEBRIS, BEACON_LOST, STAIRS), priority class P0..P3 (2 bits), flags (2 bits:</text><text x="20" y="270" font-size="11.5" font-family="DejaVu Sans, Arial, sans-serif">human_intervention_required, verified).  hdg = heading in 1/256 turns.  hopF/hopR/tgtF/tgtR = metres ahead / to the right in decimetres (+-12.7 m).</text><text x="20" y="290" font-size="11.5" font-family="DejaVu Sans, Arial, sans-serif">temp = 0.1 C units, gas = ppm, n = number of victims, t0 = time the beacon was written (used for aging), mirror = id + seq of a neighbour.</text><text x="20" y="310" font-size="11.5" font-family="DejaVu Sans, Arial, sans-serif"></text><text x="20" y="330" font-size="11.5" font-family="DejaVu Sans, Arial, sans-serif">How positions are rebuilt: each beacon says 'I am hopF m ahead and hopR m to the right of my PARENT (in the parent's heading); what I found</text><text x="20" y="350" font-size="11.5" font-family="DejaVu Sans, Arial, sans-serif">is tgtF / tgtR from ME'. The van chains the hops from the entrance anchor, so Writer drift does not accumulate in the stored frames.</text><text x="20" y="370" font-size="11.5" font-family="DejaVu Sans, Arial, sans-serif">Mirror frames: each beacon also carries a neighbour's id + seq, so a destroyed beacon is detected (missing heartbeat) and its data recovered.</text></svg>