<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="604" viewBox="0 0 1100 604"><defs><marker id="a37474f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="s37474f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#37474f"/></marker><marker id="aef6c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><marker id="sef6c00" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#ef6c00"/></marker><marker id="a1565c0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="s1565c0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#1565c0"/></marker><marker id="a2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="s2e7d32" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#2e7d32"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="550" y="26" text-anchor="middle" font-size="17" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">The Living Map: system architecture (star topology, one crossing)</text><rect x="10" y="44" width="500" height="520" rx="12" fill="#fff3e0" stroke="#bf360c" stroke-width="1.5"/><text x="26" y="68" font-size="13" font-weight="bold" fill="#bf360c" font-family="DejaVu Sans, Arial, sans-serif">INSIDE: GPS-denied, no external link (ROS domain 10)</text><rect x="530" y="44" width="170" height="520" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="615" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">OUTSIDE NETWORK AREA</text><text x="615" y="82" text-anchor="middle" font-size="10.5" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">the van: the only crossing</text><rect x="730" y="44" width="360" height="520" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="910" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32" font-family="DejaVu Sans, Arial, sans-serif">OUTSIDE: Command Post (domain 20)</text><rect x="26" y="100" width="215" height="100" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="1.6"/><text x="133.5" y="120" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Writer robot</text><text x="133.5" y="138" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">GPS to the door, then NO GPS:</text><text x="133.5" y="152" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">LiDAR exploration + odometry;</text><text x="133.5" y="166" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">temp + thermal + gas, 2-of-3 rule;</text><text x="133.5" y="180" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">decides what to record, drops beacons</text><rect x="266" y="100" width="230" height="100" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="1.6"/><text x="381.0" y="120" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Beacon mesh (32 B frames)</text><text x="381.0" y="138" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">egocentric hops, mirror frames</text><text x="381.0" y="152" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">store-and-forward, ARQ x3,</text><text x="381.0" y="166" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">repeaters where the link is weak</text><text x="381.0" y="180" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">CRC16 + 3-byte MAC</text><rect x="26" y="262" width="225" height="74" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="1.6"/><text x="138.5" y="282" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Ambulance</text><text x="138.5" y="300" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">rescues people and animals;</text><text x="138.5" y="314" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">waits for 'hazard cleared'</text><rect x="271" y="262" width="225" height="74" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="1.6"/><text x="383.5" y="282" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Fire truck</text><text x="383.5" y="300" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">extinguishes fires,</text><text x="383.5" y="314" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">seals gas leaks</text><text x="26" y="250" font-size="12" font-weight="bold" fill="#bf360c" font-family="DejaVu Sans, Arial, sans-serif">Executors (robots that leave the van)</text><rect x="26" y="392" width="470" height="156" rx="8" fill="#fff8e1" stroke="#bf360c" stroke-width="1.6"/><text x="261.0" y="412" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">No robot-to-robot channel, not even a hidden one</text><text x="261.0" y="430" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">Robots publish only to the van and listen only to the van.</text><text x="261.0" y="444" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">They never read beacon state written by another robot.</text><text x="261.0" y="458" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">What one robot must know about another arrives as a</text><text x="261.0" y="472" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">message from the Command Post, relayed by the van</text><text x="261.0" y="486" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">(briefing before entry, ORDER_UPDATE while inside).</text><text x="261.0" y="500" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">audit.py and a test fail if a robot listens to anything else.</text><rect x="540" y="100" width="150" height="170" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.6"/><text x="615.0" y="120" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Van gateway</text><text x="615.0" y="138" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">decode, CRC16 + MAC</text><text x="615.0" y="152" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">chain hops from the</text><text x="615.0" y="166" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">entrance anchor</text><text x="615.0" y="180" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">ENU -&gt; WGS84 (GPS)</text><text x="615.0" y="194" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">adaptive queue:</text><text x="615.0" y="208" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">P0 goes out at once,</text><text x="615.0" y="222" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">others 120 s / size / score</text><rect x="540" y="292" width="150" height="110" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.6"/><text x="615.0" y="312" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Station link</text><text x="615.0" y="330" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">robot &lt;-&gt; van:</text><text x="615.0" y="344" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">status, orders,</text><text x="615.0" y="358" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">exploration complete</text><text x="615.0" y="372" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">(protocol TBD)</text><rect x="742" y="100" width="160" height="64" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/><text x="822.0" y="120" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Event store</text><text x="822.0" y="138" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">id, type, location, t0,</text><text x="822.0" y="152" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">base + effective pi</text><rect x="916" y="100" width="160" height="64" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/><text x="996.0" y="120" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Correlator</text><text x="996.0" y="138" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">fire + gas, victim + hazard</text><text x="996.0" y="152" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">-&gt; one incident</text><rect x="742" y="178" width="160" height="64" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/><text x="822.0" y="198" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Priority manager</text><text x="822.0" y="216" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">pi(t) = pi0 e^(-0.004 t)</text><text x="822.0" y="230" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">lower number = more urgent</text><rect x="916" y="178" width="160" height="64" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/><text x="996.0" y="198" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Planner, 1 s cycle</text><text x="996.0" y="216" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">aggregate, preempt, hold</text><text x="996.0" y="230" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">low-urgency jobs</text><rect x="742" y="256" width="160" height="64" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/><text x="822.0" y="276" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Executor selection</text><text x="822.0" y="294" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">by capability,</text><text x="822.0" y="308" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">lost-robot fallback</text><rect x="916" y="256" width="160" height="64" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/><text x="996.0" y="276" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Live map + table</text><text x="996.0" y="294" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">web pages :8080 :8081,</text><text x="996.0" y="308" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">ranked orders, data flow</text><rect x="742" y="334" width="334" height="76" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/><text x="909.0" y="354" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Replanning of running orders</text><text x="909.0" y="372" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">ORDER_UPDATE through the van: new hazard,</text><text x="909.0" y="386" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">hazard cleared, new job. A robot silent for 35 s</text><text x="909.0" y="400" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">is LOST and its jobs are re-assigned.</text><rect x="742" y="424" width="334" height="124" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/><text x="909.0" y="444" text-anchor="middle" font-size="12" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Frame translation (entrance anchor)</text><text x="909.0" y="462" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">private robot coordinates -&gt; real GPS:</text><text x="909.0" y="476" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">X = x cos t - y sin t,   Y = x sin t + y cos t</text><text x="909.0" y="490" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">lat = lat0 + Y / R</text><text x="909.0" y="504" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">lon = lon0 + X / (R cos lat0)</text><text x="909.0" y="518" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">anchor (lat0, lon0, t) is fixed at the entrance door</text><line x1="241" y1="150" x2="266" y2="150" stroke="#ef6c00" stroke-width="2" marker-end="url(#aef6c00)"/><circle cx="253" cy="138" r="10" fill="white" stroke="#ef6c00" stroke-width="2"/><text x="253" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef6c00" font-family="DejaVu Sans, Arial, sans-serif">1</text><line x1="496" y1="150" x2="540" y2="150" stroke="#ef6c00" stroke-width="2" marker-end="url(#aef6c00)"/><circle cx="518" cy="138" r="10" fill="white" stroke="#ef6c00" stroke-width="2"/><text x="518" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef6c00" font-family="DejaVu Sans, Arial, sans-serif">2</text><line x1="138" y1="336" x2="138" y2="372" stroke="#1565c0" stroke-width="2"/><line x1="383" y1="336" x2="383" y2="372" stroke="#1565c0" stroke-width="2"/><line x1="138" y1="372" x2="383" y2="372" stroke="#1565c0" stroke-width="2"/><line x1="383" y1="372" x2="510" y2="372" stroke="#1565c0" stroke-width="2"/><line x1="510" y1="372" x2="540" y2="350" stroke="#1565c0" stroke-width="2" marker-end="url(#a1565c0)" marker-start="url(#s1565c0)"/><circle cx="500" cy="360" r="10" fill="white" stroke="#1565c0" stroke-width="2"/><text x="500" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">3</text><line x1="690" y1="160" x2="742" y2="132" stroke="#1565c0" stroke-width="2" marker-end="url(#a1565c0)"/><circle cx="716" cy="142" r="10" fill="white" stroke="#1565c0" stroke-width="2"/><text x="716" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">4</text><line x1="742" y1="296" x2="690" y2="350" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2e7d32)"/><circle cx="716" cy="330" r="10" fill="white" stroke="#2e7d32" stroke-width="2"/><text x="716" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32" font-family="DejaVu Sans, Arial, sans-serif">5</text><line x1="520" y1="44" x2="520" y2="564" stroke="#c62828" stroke-width="3" stroke-dasharray="10 6"/><line x1="710" y1="44" x2="710" y2="564" stroke="#c62828" stroke-width="3" stroke-dasharray="10 6"/><text x="615" y="470" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828" font-family="DejaVu Sans, Arial, sans-serif">AIR-GAP</text><text x="615" y="486" text-anchor="middle" font-size="10" fill="#c62828" font-family="DejaVu Sans, Arial, sans-serif">no direct link between</text><text x="615" y="499" text-anchor="middle" font-size="10" fill="#c62828" font-family="DejaVu Sans, Arial, sans-serif">robots and the</text><text x="615" y="512" text-anchor="middle" font-size="10" fill="#c62828" font-family="DejaVu Sans, Arial, sans-serif">Command Post</text><text x="550" y="590" text-anchor="middle" font-size="11" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">1 the Writer drops a beacon  |  2 RF packets, multi-hop to the van  |  3 robot status and orders (relay)  |  4 uplink UDP 9101  |  5 downlink UDP 9102 (ORDER_UPDATE)</text></svg>