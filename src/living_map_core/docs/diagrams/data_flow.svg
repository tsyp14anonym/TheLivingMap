<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="205" viewBox="0 0 1100 205"><defs><marker id="a37474f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="s37474f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#37474f"/></marker><marker id="a1565c0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="s1565c0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#1565c0"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="550" y="22" text-anchor="middle" font-size="15" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Data flow: from detection to a finished rescue</text><rect x="12" y="50" width="150" height="58" rx="8" fill="#fff3e0" stroke="#bf360c" stroke-width="1.6"/><text x="87.0" y="70" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Writer</text><text x="87.0" y="88" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">senses, decides what to record</text><line x1="162" y1="79" x2="192" y2="79" stroke="#37474f" stroke-width="2" marker-end="url(#a37474f)"/><rect x="192" y="50" width="150" height="58" rx="8" fill="#fff3e0" stroke="#bf360c" stroke-width="1.6"/><text x="267.0" y="70" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Beacon</text><text x="267.0" y="88" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">32 B, egocentric, CRC + MAC</text><line x1="342" y1="79" x2="372" y2="79" stroke="#37474f" stroke-width="2" marker-end="url(#a37474f)"/><rect x="372" y="50" width="150" height="58" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="447.0" y="70" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Van (ONA)</text><text x="447.0" y="88" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">verify, chain, GPS, queue</text><line x1="522" y1="79" x2="552" y2="79" stroke="#37474f" stroke-width="2" marker-end="url(#a37474f)"/><rect x="552" y="50" width="150" height="58" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/><text x="627.0" y="70" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Command Post</text><text x="627.0" y="88" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">rank, group, one order</text><line x1="702" y1="79" x2="732" y2="79" stroke="#37474f" stroke-width="2" marker-end="url(#a37474f)"/><rect x="732" y="50" width="150" height="58" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="807.0" y="70" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Briefing</text><text x="807.0" y="88" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">mission file at the van</text><line x1="882" y1="79" x2="912" y2="79" stroke="#37474f" stroke-width="2" marker-end="url(#a37474f)"/><rect x="912" y="50" width="150" height="58" rx="8" fill="#fff3e0" stroke="#bf360c" stroke-width="1.6"/><text x="987.0" y="70" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Executor</text><text x="987.0" y="88" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">A*, rescue / extinguish</text><text x="177.0" y="130" text-anchor="middle" font-size="9.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">RF, multi-hop, ARQ x3</text><text x="357.0" y="130" text-anchor="middle" font-size="9.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">uplink UDP :9101</text><text x="537.0" y="130" text-anchor="middle" font-size="9.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">orders 1 s cycle</text><text x="717.0" y="130" text-anchor="middle" font-size="9.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">handed over before entry</text><text x="897.0" y="130" text-anchor="middle" font-size="9.5" fill="#37474f" font-family="DejaVu Sans, Arial, sans-serif">status, ORDER_UPDATE via the van</text><path d="M 987.0 108 L 987.0 162 L 447.0 162 L 447.0 108" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a1565c0)"/><text x="717.0" y="178" text-anchor="middle" font-size="10" fill="#1565c0" font-family="DejaVu Sans, Arial, sans-serif">the Executor reports only to the van; the van forwards to the Command Post (no robot-to-robot link)</text></svg>